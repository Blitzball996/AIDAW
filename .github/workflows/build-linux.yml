name: Build Linux

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxcomposite-dev \
            libgl-dev \
            libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev \
            ladspa-sdk

      - name: Download GeneralUser GS SoundFont
        run: |
          mkdir -p assets/soundfonts
          # Upstream renamed the file; the old versioned path now 404s and curl -L
          # happily writes GitHub's HTML error page into the .sf2, silently
          # shipping a soundfont the player cannot parse (= no audio at all).
          curl -fL --retry 3 --retry-delay 5             "https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2"             -o assets/soundfonts/GeneralUser_GS.sf2
          # Fail the build rather than ship a broken soundfont: check RIFF magic
          # and a plausible size (the real file is ~31 MB).
          size=$(wc -c < assets/soundfonts/GeneralUser_GS.sf2)
          magic=$(head -c 4 assets/soundfonts/GeneralUser_GS.sf2)
          if [ "$magic" != "RIFF" ] || [ "$size" -lt 10000000 ]; then
            echo "SoundFont download invalid: magic='$magic' size=$size"
            exit 1
          fi
          echo "SoundFont OK: $size bytes"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target magda_daw_app

      - name: Package
        run: |
          mkdir -p package/Blitz
          BIN_PATH="build/magda/daw/magda_daw_app_artefacts/Release/Blitz"
          if [ ! -f "$BIN_PATH" ]; then
            echo "Binary not found at $BIN_PATH"
            find build -name "Blitz" -o -name "magda_daw_app" | head -10
            exit 1
          fi
          cp "$BIN_PATH" package/Blitz/
          cp -r assets/soundfonts package/Blitz/ 2>/dev/null || true
          tar -czf Blitz-linux-x86_64.tar.gz -C package Blitz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blitz-Linux-x86_64
          path: Blitz-linux-x86_64.tar.gz
