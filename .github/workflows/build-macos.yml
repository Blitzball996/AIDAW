name: Build macOS DMG

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install dependencies
        run: brew install ninja

      - name: Download GeneralUser GS SoundFont
        run: |
          mkdir -p assets/soundfonts
          curl -L "https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser%20GS%20v1.471.sf2" \
            -o assets/soundfonts/GeneralUser_GS.sf2

      - name: Restore Faust build directory
        run: |
          # Faust's build/CMakeLists.txt is excluded by faust's .gitignore
          # but it's a source file needed for CMake. Restore it via git.
          cd third_party/faust
          git checkout -- build/

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build
        run: cmake --build build --config Release --target magda_daw_app

      - name: Create DMG
        run: |
          APP_PATH="build/magda/daw/magda_daw_app_artefacts/Release/Blitz.app"
          if [ ! -d "$APP_PATH" ]; then
            find build -name "*.app" -type d
            exit 1
          fi
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Blitz" -srcfolder dmg_staging \
            -ov -format UDZO "Blitz.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Blitz-macOS
          path: Blitz.dmg
