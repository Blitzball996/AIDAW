name: Build macOS DMG

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------- arm64 (Apple Silicon) modern build, macOS 11+ -----------
  build-macos-arm64:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Faust build directory
        run: cd third_party/faust && git checkout -- build/ || true

      - name: Install dependencies
        run: brew install ninja

      - name: Download GeneralUser GS SoundFont
        run: |
          mkdir -p assets/soundfonts
          # Upstream renamed the file; the old versioned path now 404s and curl -L
          # happily writes GitHub's HTML error page into the .sf2, silently
          # shipping a soundfont the player cannot parse (= no audio at all).
          curl -fL --retry 3 --retry-delay 5             "https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2"             -o assets/soundfonts/GeneralUser_GS.sf2
          # Fail the build rather than ship a broken soundfont: check RIFF magic
          # and a plausible size (the real file is ~31 MB).
          size=$(wc -c < assets/soundfonts/GeneralUser_GS.sf2)
          magic=$(head -c 4 assets/soundfonts/GeneralUser_GS.sf2)
          if [ "$magic" != "RIFF" ] || [ "$size" -lt 10000000 ]; then
            echo "SoundFont download invalid: magic='$magic' size=$size"
            exit 1
          fi
          echo "SoundFont OK: $size bytes"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build
        run: cmake --build build --config Release --target magda_daw_app

      - name: Create DMG
        run: |
          APP="build/magda/daw/magda_daw_app_artefacts/Release/Blitz.app"
          [ -d "$APP" ] || { find build -name "*.app" -type d; exit 1; }
          # Unsigned .app bundles that travel through a zip/dmg arrive with a
          # broken/absent signature, and macOS reports that as "Blitz.app is
          # damaged and can't be opened" rather than as a signing problem.
          # An ad-hoc signature (no paid Developer ID needed) makes the bundle
          # internally consistent so Gatekeeper shows the normal
          # "unidentified developer" prompt instead, which the user can accept.
          # --deep is required: every embedded dylib/framework must be signed
          # too, and the outermost seal must be applied last.
          xattr -cr "$APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          # hdiutil intermittently fails with "Resource busy" on CI runners; retry.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Blitz" -srcfolder dmg_staging -ov -format UDZO Blitz-arm64.dmg; then
              break
            fi
            echo "hdiutil attempt $attempt failed, retrying in 10s..."
            hdiutil detach /Volumes/Blitz 2>/dev/null || true
            sleep 10
            [ "$attempt" = 5 ] && { echo "hdiutil failed after 5 attempts"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Blitz-macOS-arm64
          path: Blitz-arm64.dmg

  # ----------- x86_64 legacy build cross-compiled on macOS 14, macOS 10.13+ -----------
  build-macos-x86-legacy:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Faust build directory
        run: cd third_party/faust && git checkout -- build/ || true

      - name: Install dependencies
        run: brew install ninja

      - name: Download GeneralUser GS SoundFont
        run: |
          mkdir -p assets/soundfonts
          # Upstream renamed the file; the old versioned path now 404s and curl -L
          # happily writes GitHub's HTML error page into the .sf2, silently
          # shipping a soundfont the player cannot parse (= no audio at all).
          curl -fL --retry 3 --retry-delay 5             "https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2"             -o assets/soundfonts/GeneralUser_GS.sf2
          # Fail the build rather than ship a broken soundfont: check RIFF magic
          # and a plausible size (the real file is ~31 MB).
          size=$(wc -c < assets/soundfonts/GeneralUser_GS.sf2)
          magic=$(head -c 4 assets/soundfonts/GeneralUser_GS.sf2)
          if [ "$magic" != "RIFF" ] || [ "$size" -lt 10000000 ]; then
            echo "SoundFont download invalid: magic='$magic' size=$size"
            exit 1
          fi
          echo "SoundFont OK: $size bytes"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DMAGDA_ENABLE_LOCAL_LLM=OFF

      - name: Build
        run: cmake --build build --config Release --target magda_daw_app

      - name: Create DMG
        run: |
          APP="build/magda/daw/magda_daw_app_artefacts/Release/Blitz.app"
          [ -d "$APP" ] || { find build -name "*.app" -type d; exit 1; }
          # Unsigned .app bundles that travel through a zip/dmg arrive with a
          # broken/absent signature, and macOS reports that as "Blitz.app is
          # damaged and can't be opened" rather than as a signing problem.
          # An ad-hoc signature (no paid Developer ID needed) makes the bundle
          # internally consistent so Gatekeeper shows the normal
          # "unidentified developer" prompt instead, which the user can accept.
          # --deep is required: every embedded dylib/framework must be signed
          # too, and the outermost seal must be applied last.
          xattr -cr "$APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          # hdiutil intermittently fails with "Resource busy" on CI runners; retry.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Blitz" -srcfolder dmg_staging -ov -format UDZO Blitz-x86.dmg; then
              break
            fi
            echo "hdiutil attempt $attempt failed, retrying in 10s..."
            hdiutil detach /Volumes/Blitz 2>/dev/null || true
            sleep 10
            [ "$attempt" = 5 ] && { echo "hdiutil failed after 5 attempts"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Blitz-macOS-x86_64
          path: Blitz-x86.dmg
