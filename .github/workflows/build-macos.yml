name: Build macOS DMG

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ----------- arm64 (Apple Silicon) modern build, macOS 11+ -----------
  build-macos-arm64:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Faust build directory
        run: cd third_party/faust && git checkout -- build/ || true

      - name: Install dependencies
        run: brew install ninja

      - name: Download GeneralUser GS SoundFont
        run: |
          mkdir -p assets/soundfonts
          curl -L "https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser%20GS%20v1.471.sf2" \
            -o assets/soundfonts/GeneralUser_GS.sf2

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build
        run: cmake --build build --config Release --target magda_daw_app

      - name: Create DMG
        run: |
          APP="build/magda/daw/magda_daw_app_artefacts/Release/Blitz.app"
          [ -d "$APP" ] || { find build -name "*.app" -type d; exit 1; }
          mkdir dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Blitz" -srcfolder dmg_staging -ov -format UDZO Blitz-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Blitz-macOS-arm64
          path: Blitz-arm64.dmg

  # ----------- x86_64 legacy build, macOS 10.14+ -----------
  build-macos-x86-legacy:
    runs-on: macos-13    # last runner with x86_64 support
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.14"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Faust build directory
        run: cd third_party/faust && git checkout -- build/ || true

      - name: Install dependencies
        run: brew install ninja

      - name: Download GeneralUser GS SoundFont
        run: |
          mkdir -p assets/soundfonts
          curl -L "https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser%20GS%20v1.471.sf2" \
            -o assets/soundfonts/GeneralUser_GS.sf2

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DMAGDA_ENABLE_LOCAL_LLM=OFF

      - name: Build
        run: cmake --build build --config Release --target magda_daw_app

      - name: Create DMG
        run: |
          APP="build/magda/daw/magda_daw_app_artefacts/Release/Blitz.app"
          [ -d "$APP" ] || { find build -name "*.app" -type d; exit 1; }
          mkdir dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Blitz" -srcfolder dmg_staging -ov -format UDZO Blitz-x86.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Blitz-macOS-x86_64
          path: Blitz-x86.dmg
